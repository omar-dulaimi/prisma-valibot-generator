name: Semantic Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      # Required. @semantic-release/npm requests a GitHub OIDC token and exchanges it with npm for a
      # short-lived publish credential; without this the exchange fails and there is no token to fall
      # back on, because the package disallows them.
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    # Node 24 ships npm >= 11.5.1, the first version that can perform the OIDC exchange.
    # Deliberately no `registry-url`: it writes an .npmrc containing an authToken placeholder, which
    # gets in the way of the OIDC exchange below.
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
    
        
    - name: Build and test
      run: |
        npm run gen-example
        npm run test:type-check
        npm run lint
        npm run ci:test
        
    - name: Build package
      run: ./package.sh
      
    # No npm token: the package is configured for Trusted Publishing with tokens disallowed, so
    # auth is the OIDC exchange alone. Setting NPM_TOKEN here would write a conflicting .npmrc.
    - name: Semantic Release (with npm lifecycle)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run release

    - name: Commit and push workflow mutations (if any)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        # Stage docs and common release-mutation files to avoid failing on dirty tree
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A \
          package.json \
          package-lock.json \
          package/package.json \
          CHANGELOG.md || true
        # If nothing is staged, skip committing to avoid exit 1 from git commit
        if git diff --cached --quiet; then
          echo "No docs changes to commit"
          exit 0
        fi
        LAST_TAG=$(git describe --tags --abbrev=0 || echo "latest")
        git commit -m "chore(ci): commit workflow mutations (version bumps, lockfile, docs) for ${LAST_TAG} [skip ci]"
        git push origin HEAD:${GITHUB_REF_NAME}
